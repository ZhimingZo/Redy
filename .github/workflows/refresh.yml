name: refresh

# Tech and Traditional once a day, 13:17 UTC, after the startup crawl.
# This does not call crawl_boards: that rewrite keeps only Greenhouse, Lever, and Ashby
# and would drop Workday, Oracle, and the company-specific pages.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python -m crawler --refresh tech
      - name: Commit tech if it changed
        run: |
          git config user.name "redy-bot"
          git config user.email "redy-bot@users.noreply.github.com"
          git add web/data/tech.json
          git diff --cached --quiet || git commit -m "data: refresh tech $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - run: python -m crawler --refresh traditional
      - name: Commit traditional if it changed
        run: |
          git config user.name "redy-bot"
          git config user.email "redy-bot@users.noreply.github.com"
          git add web/data/traditional.json
          git diff --cached --quiet || git commit -m "data: refresh traditional $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - run: python -m crawler --monitor
      - name: Commit link check if it changed
        run: |
          git config user.name "redy-bot"
          git config user.email "redy-bot@users.noreply.github.com"
          git add web/data/jobs.json web/data/tech.json web/data/traditional.json
          git diff --cached --quiet || git commit -m "data: check links $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
